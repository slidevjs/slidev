ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
catalogMode: prefer
catalogPrune: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - langium
  - undici-types@6.21.0

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*
  - demo/*
  - cypress/fixtures/*
  - docs

overrides:
  markdown-exit: catalog:prod
  rollup: ^4.63.3
  semver: ^7.8.5
  # vscode-languageserver / vscode-languageclient pin these to exact 3.17.5, which prevents
  # pnpm from deduping against the ^3.17.5 range used elsewhere (resolving to 3.18.3), causing
  # duplicate vscode-languageserver-types instances and type errors in packages/vscode
  vscode-languageserver-protocol: 3.17.5
  vscode-languageserver-types: 3.17.5
  # Pinning workbox-build to avoid introducing @trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1
  workbox-build: 7.3.0

patchedDependencies:
  '@hedgedoc/markdown-it-plugins@2.1.4': patches/@hedgedoc__markdown-it-plugins@2.1.4.patch

allowBuilds:
  '@vscode/vsce-sign': true
  cypress: true
  esbuild: true
  keytar: true
  playwright-chromium: true
  simple-git-hooks: true
  typeit: true
  unrs-resolver: true

